name: ThreatLens CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-coverage:
    name: Backend Pytest, Coverage & Security Audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest pytest-cov httpx reportlab passlib[bcrypt] python-jose[cryptography] slowapi email-validator bcrypt==4.0.1
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run Test Suite
        env:
          PYTHONPATH: .
        run: |
          python -m pytest -v

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          npm install

      - name: Next.js Production Build
        run: |
          npm run build