name: ThreatLens CI/CD Pipeline

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  backend-test-and-coverage:
    name: Backend Pytest, Coverage & Security Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Dependencies
        run: |
          cd backend
          python -m pip install --upgrade pip
          pip install fastapi uvicorn pydantic pytest pytest-cov httpx reportlab passlib python-jose slowapi
          if [ -f requirements.txt ]; then pip install -r requirements.txt || true; fi

      - name: Run Test Suite with Coverage
        env:
          PYTHONPATH: backend
        run: |
          cd backend
          python -m pytest tests/ -v --cov=app.api.v1.endpoints.export --cov-report=term-missing

  frontend-build:
    name: Frontend Lint & Production Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: |
          cd frontend
          npm install

      - name: Build Next.js Application
        run: |
          cd frontend
          npm run build