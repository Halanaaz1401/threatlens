apiVersion: v1
kind: Namespace
metadata:
  name: threatlens

---
# Backend API Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatlens-backend
  namespace: threatlens
  labels:
    app: threatlens-backend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threatlens-backend
  template:
    metadata:
      labels:
        app: threatlens-backend
    spec:
      containers:
        - name: backend
          image: threatlens-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8000
          env:
            - name: DATABASE_URL
              value: "postgresql://threatlens:threatlens123@postgres-service:5432/threatlens_db"
            - name: REDIS_HOST
              value: "redis-service"
            - name: ELASTICSEARCH_HOST
              value: "http://elasticsearch-service:9200"
          resources:
            requests:
              cpu: "250m"
              memory: "512Mi"
            limits:
              cpu: "1000m"
              memory: "1Gi"
          livenessProbe:
            httpGet:
              path: /
              port: 8000
            initialDelaySeconds: 15
            periodSeconds: 20

---
apiVersion: v1
kind: Service
metadata:
  name: threatlens-backend-service
  namespace: threatlens
spec:
  type: ClusterIP
  selector:
    app: threatlens-backend
  ports:
    - port: 8000
      targetPort: 8000

---
# Frontend Web Deployment & Service
apiVersion: apps/v1
kind: Deployment
metadata:
  name: threatlens-frontend
  namespace: threatlens
  labels:
    app: threatlens-frontend
spec:
  replicas: 2
  selector:
    matchLabels:
      app: threatlens-frontend
  template:
    metadata:
      labels:
        app: threatlens-frontend
    spec:
      containers:
        - name: frontend
          image: threatlens-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 3000
          env:
            - name: NEXT_PUBLIC_API_URL
              value: "http://localhost:8000"
          resources:
            requests:
              cpu: "100m"
              memory: "256Mi"
            limits:
              cpu: "500m"
              memory: "512Mi"

---
apiVersion: v1
kind: Service
metadata:
  name: threatlens-frontend-service
  namespace: threatlens
spec:
  type: NodePort
  selector:
    app: threatlens-frontend
  ports:
    - port: 3000
      targetPort: 3000
      nodePort: 30080