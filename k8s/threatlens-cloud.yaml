apiVersion: v1
kind: ConfigMap
metadata:
  name: threatlens-config
  namespace: threatlens
data:
  ENVIRONMENT: "production"
  LOG_LEVEL: "INFO"
  ELASTICSEARCH_HOST: "http://elasticsearch-service:9200"
  REDIS_HOST: "redis-service"

---
apiVersion: v1
kind: Secret
metadata:
  name: threatlens-secrets
  namespace: threatlens
type: Opaque
stringData:
  DATABASE_URL: "postgresql://threatlens:threatlens123@postgres-service:5432/threatlens_db"
  JWT_SECRET: "super-secure-threatlens-production-jwt-secret-key-32bytes"

---
# Horizontal Pod Autoscaler (HPA) for Backend
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: threatlens-backend-hpa
  namespace: threatlens
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: threatlens-backend
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 75

---
# Ingress Controller Routing
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: threatlens-ingress
  namespace: threatlens
  annotations:
    kubernetes.io/ingress.class: "nginx"
    cert-manager.io/cluster-issuer: "letsencrypt-prod"
spec:
  rules:
    - host: threatlens.local
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: threatlens-backend-service
                port:
                  number: 8000
          - path: /
            pathType: Prefix
            backend:
              service:
                name: threatlens-frontend-service
                port:
                  number: 3000